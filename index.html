<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangumi 评分卡</title>
  <link rel="icon" href="https://bgm.tv/img/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="tool-header">
      <h1>Bangumi 评分卡</h1>
      <p>载入 Bangumi 条目信息，导入或手填评分分布，再生成评分卡。</p>
    </header>

    <main class="workspace">
      <section class="editor-column" aria-label="评分卡编辑">
        <section class="editor-section">
          <h2>条目</h2>
          <div class="subject-loader">
            <input id="subjectInput" class="text-input subject-input" type="text" inputmode="url" placeholder="条目 ID 或 https://bgm.tv/subject/…" autocomplete="off">
            <button id="loadSubjectBtn" class="bgm-button primary" type="button">载入 Bangumi</button>
          </div>
          <p id="loadStatus" class="status-line" aria-live="polite">输入条目 ID 或链接。</p>

          <div id="subjectInfo" class="subject-info is-empty">
            <div class="subject-thumb-wrap">
              <img id="editorCover" class="subject-thumb" alt="" hidden>
              <div id="editorCoverPlaceholder" class="subject-thumb-placeholder">NO IMAGE</div>
            </div>
            <dl class="subject-fields">
              <div><dt>标题</dt><dd id="infoTitle">—</dd></div>
              <div><dt>日期</dt><dd id="infoDate">—</dd></div>
              <div><dt>话数</dt><dd id="infoEps">—</dd></div>
              <div><dt>ID</dt><dd id="infoId">—</dd></div>
            </dl>
          </div>
        </section>

        <section class="editor-section">
          <div class="section-heading-row">
            <h2>评分</h2>
            <span id="ratingModeText" class="section-note">等待条目</span>
          </div>

          <div class="rating-actions">
            <button id="importRatingBtn" class="bgm-button" type="button" disabled>导入 Bangumi 评分</button>
            <button id="clearRatingBtn" class="bgm-button" type="button">清空，手动填写</button>
            <label class="rank-toggle" for="showRankInput">
              <input id="showRankInput" type="checkbox" disabled>
              显示 Bangumi 排名
            </label>
          </div>

          <div id="scoreInputs" class="score-input-grid" aria-label="各分值人数"></div>

          <div class="rating-summary">
            <span>当前评分 <strong id="editorScore">--</strong></span>
            <span><strong id="editorVotes">0</strong> votes</span>
            <span id="editorRank" hidden>Rank #--</span>
          </div>
        </section>

        <section class="editor-section compact-section">
          <h2>输出</h2>
          <div class="output-actions">
            <button id="downloadBtn" class="bgm-button primary" type="button">保存评分卡 PNG</button>
            <a id="openSubjectLink" class="text-link disabled-link" href="#" target="_blank" rel="noreferrer">打开 Bangumi 条目</a>
          </div>
          <p id="exportStatus" class="status-line" aria-live="polite"></p>
        </section>
      </section>

      <section class="preview-column" aria-label="评分卡预览">
        <div class="preview-heading">
          <h2>预览</h2>
          <span>评分卡样式直接沿用旧工具</span>
        </div>
        <div class="preview-frame">
          <main id="capture">
            <header id="headerSubject">
              <h1 id="cardTitle">请先载入 Bangumi 条目</h1>
              <div id="cardMeta" class="meta"></div>
            </header>
            <div class="subject-columns">
              <div class="cover-slot">
                <img id="cardCover" alt="" crossorigin="anonymous" hidden>
                <div id="cardCoverPlaceholder" class="cover-placeholder">NO IMAGE</div>
              </div>
              <section class="SidePanel">
                <h2>收藏盒</h2>
                <div id="globalRating" class="global_rating score1">
                  <div class="rateEmo"></div>
                  <div class="global_score">
                    <span id="cardScore" class="number">--</span><span id="cardDescription" class="description"></span>
                    <div id="cardRanking" class="ranking" hidden><small class="grey">Bangumi Anime Ranked:</small><small id="cardRankText" class="alarm">#--</small></div>
                  </div>
                </div>
                <div id="ChartWarpper" class="chartWrapper">
                  <div class="chart_desc"><small class="grey"><span id="cardVotes" property="v:votes">0</span> votes</small></div>
                  <ul id="horizontalChart" class="horizontalChart"></ul>
                </div>
              </section>
            </div>
          </main>
        </div>
      </section>
    </main>
  </div>

  <script src="logic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
