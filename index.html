<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangumi 评分卡</title>
  <link rel="icon" href="https://bgm.tv/img/favicon.ico">
  <link rel="stylesheet" href="style.css?v=20260928-3">
</head>
<body>
  <div class="page-shell">
    <header class="tool-header">
      <h1>Bangumi 评分卡</h1>
      <p>载入 Bangumi 条目信息，导入或手填评分分布，再生成评分卡。</p>
    </header>

    <main class="workspace">
      <section class="editor-column" aria-label="评分卡编辑">
        <section class="editor-section">
          <h2>条目</h2>
          <div class="subject-loader">
            <input id="subjectInput" class="text-input subject-input" type="text" inputmode="url" placeholder="条目 ID 或 https://bgm.tv/subject/…" autocomplete="off">
            <button id="loadSubjectBtn" class="bgm-button primary" type="button">载入 Bangumi</button>
          </div>
          <p id="loadStatus" class="status-line" aria-live="polite">输入条目 ID 或链接。</p>

          <div id="subjectInfo" class="subject-info is-empty">
            <div class="subject-thumb-wrap">
              <img id="editorCover" class="subject-thumb" alt="" hidden>
              <div id="editorCoverPlaceholder" class="subject-thumb-placeholder">NO IMAGE</div>
            </div>
            <dl class="subject-fields">
              <div><dt>标题</dt><dd id="infoTitle">—</dd></div>
              <div><dt>日期</dt><dd id="infoDate">—</dd></div>
              <div><dt>话数</dt><dd id="infoEps">—</dd></div>
              <div><dt>ID</dt><dd id="infoId">—</dd></div>
            </dl>
          </div>
        </section>

        <section class="editor-section">
          <div class="section-heading-row">
            <h2>BGM 评分</h2>
            <span id="ratingModeText" class="section-note">等待条目</span>
          </div>

          <div class="rating-actions">
            <button id="importRatingBtn" class="bgm-button" type="button" disabled>导入 Bangumi 评分</button>
            <button id="clearRatingBtn" class="bgm-button" type="button">清空，手动填写</button>
            <label class="rank-toggle" for="showRankInput">
              <input id="showRankInput" type="checkbox" disabled>
              显示 Bangumi 排名
            </label>
          </div>

          <div id="scoreInputs" class="score-input-grid" aria-label="各分值人数"></div>

          <div class="rating-summary">
            <span>BGM 评分 <strong id="editorScore">--</strong></span>
            <span><strong id="editorVotes">0</strong> votes</span>
            <span>标准差 <strong id="editorStdDev">--</strong></span>
            <span>争议度 <strong id="editorControversy">--</strong></span>
            <span id="editorRank" hidden>Rank #--</span>
          </div>
        </section>

        <section class="editor-section">
          <h2>自定义评分</h2>
          <div class="custom-rating-grid">
            <label>
              <span>评分名前缀</span>
              <input id="customLabelInput" class="text-input" type="text" maxlength="12" placeholder="例如：豆瓣 / 科排 / VIB" autocomplete="off">
              <small>留空时显示“???评分”</small>
            </label>
            <label>
              <span>分数</span>
              <input id="customScoreInput" class="text-input" type="number" min="0" max="10" step="0.001" placeholder="例如：8.579">
              <small>评分卡中统一显示三位小数</small>
            </label>
          </div>
        </section>

        <section class="editor-section compact-section">
          <h2>输出</h2>
          <div class="output-actions">
            <button id="downloadBtn" class="bgm-button primary" type="button">保存评分卡 PNG</button>
            <a id="openSubjectLink" class="text-link disabled-link" href="#" target="_blank" rel="noreferrer">打开 Bangumi 条目</a>
          </div>
          <p id="exportStatus" class="status-line" aria-live="polite"></p>
        </section>
      </section>

      <section class="preview-column" aria-label="评分卡预览">
        <div class="preview-heading">
          <h2>预览</h2>
          <span>收藏盒样式</span>
        </div>
        <div class="preview-frame dark-preview">
          <main id="capture" class="rating-widget">
            <header class="widget-header">
              <h3>收藏盒</h3>
            </header>

            <nav class="collection-tabs" aria-label="收藏状态">
              <span>想看</span>
              <span class="is-active">看过</span>
              <span>在看</span>
              <span>搁置</span>
              <span>抛弃</span>
            </nav>

            <section class="score-panel">
              <div id="globalRating" class="global_rating score1">
                <div class="rateEmo"></div>
                <div class="score-lines">
                  <div class="score-line">
                    <span id="customScoreLabel" class="score-label">???评分</span>
                    <span id="customScoreValue" class="score-value">--</span>
                    <span id="customScoreDescription" class="score-description"></span>
                  </div>
                  <div class="score-line">
                    <span class="score-label">BGM评分</span>
                    <span id="cardScore" class="score-value">--</span>
                    <span id="cardDescription" class="score-description"></span>
                  </div>
                  <div id="cardRanking" class="card-ranking" hidden>
                    Bangumi Anime Ranked:<span id="cardRankText" class="ranking-value">#--</span>
                  </div>
                </div>
              </div>

              <div id="ChartWarpper" class="chartWrapper">
                <div class="chart_desc"><span id="cardVotes">0</span> votes</div>
                <ul id="horizontalChart" class="horizontalChart"></ul>
              </div>

              <div class="stats-line">
                <span>标准差：<strong id="cardStdDev">--</strong></span>
                <span>争议度：<strong id="cardControversy">--</strong></span>
              </div>
            </section>
          </main>
        </div>
      </section>
    </main>
  </div>

  <script src="logic.js?v=20260928-3"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js?v=20260928-3"></script>
</body>
</html>
